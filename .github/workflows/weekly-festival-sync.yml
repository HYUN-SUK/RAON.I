name: RAONAI Weekly Festival Precision Sync

on:
  schedule:
    # 매주 월요일 05:13 KST 실행 (UTC 일요일 20:13)
    - cron: '13 20 * * 0'
  workflow_dispatch: # 수동 트리거 허용

jobs:
  sync-festivals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Weekly Festival Sync Engine
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY || secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/sync-festivals-trigger.mjs
