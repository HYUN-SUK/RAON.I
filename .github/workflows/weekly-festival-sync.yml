name: RAONAI Weekly Festival Precision Sync

on:
  schedule:
    # [2중 스케줄 분산] 1차: 월요일 07:43 KST (UTC 일요일 22:43, 피크 회피) + 2차 백업: 월요일 09:43 KST (UTC 월요일 00:43)
    - cron: '43 22 * * 0'
    - cron: '43 0 * * 1'
  workflow_dispatch: # 수동 트리거 허용

jobs:
  sync-festivals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Weekly Festival Sync Engine
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY || secrets.PUBLIC_DATA_API_KEY }}
        run: node scripts/sync-festivals-trigger.mjs
