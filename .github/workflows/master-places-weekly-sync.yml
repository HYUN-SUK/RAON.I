name: Master Places Weekly Sync

on:
  schedule:
    # [임시 패치] 3/24(화) 아침 06:00 KST 실행 (UTC 기준 3/23(월) 21:00)
    - cron: '0 21 * * 1'
  workflow_dispatch: # 수동 트리거 허용

jobs:
  sync-master-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 대용량 데이터 처리를 위해 2시간 타임아웃
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Master Places Full-Sync Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          SAFE_RESTAURANT_API_KEY: ${{ secrets.SAFE_RESTAURANT_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: node scripts/sync-master-places.mjs

      - name: Log Result
        run: echo "Master Places weekly full-sync completed at $(date)"
