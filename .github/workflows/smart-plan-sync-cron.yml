name: Smart Plan Daily Sync

on:
#  schedule:
#    # [v10.7 실험 패치] 매일 새벽 06:00 KST 실행 (UTC 기준 21:00)
#    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger via GitHub Actions UI

jobs:
  sync-public-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Smart Plan Caching Script (v11.0)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: node scripts/caching-smart-plan.mjs

      - name: Log Result
        run: echo "Smart Plan public APIs daily sync completed successfully at $(date)"
