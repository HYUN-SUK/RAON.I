name: Smart Plan Daily Sync

on:
  # [v15.0 2중 안전망] 1차 외부 크론잡(04:05 KST) + 2차 깃허브 백업 스케줄러(06:08 KST)
  schedule:
    # 06:08 KST 실행 (UTC 21:08) - 1차 완료 시 0초 스킵, 미완료 시 백업 재실행
    - cron: '8 21 * * *'
  workflow_dispatch: # Allow manual trigger via GitHub Actions UI

jobs:
  sync-public-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Smart Plan Caching Script (v11.0)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: node scripts/caching-smart-plan.mjs

      - name: Log Result
        run: echo "Smart Plan public APIs daily sync completed successfully at $(date)"
