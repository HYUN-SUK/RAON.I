name: Camping Reminder Cron

on:
  schedule:
    # 1. Prefetch (Cache external APIs) at 23:50 UTC (08:50 AM KST)
    - cron: '50 23 * * *'
    
    # 2. Dispatch (Send Push Notifications) at 00:00 UTC (09:00 AM KST)
    - cron: '0 0 * * *'

  # Allow manual trigger for testing and catch-up
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode (prefetch or dispatch)'
        required: true
        default: 'dispatch'
        type: choice
        options:
          - prefetch
          - dispatch

jobs:
  run-reminder-function:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Mode
        id: set-mode
        run: |
          # If triggered by a manual dispatch, use the input mode
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            # If triggered by schedule, determine mode based on time
            # Note: cron triggers might be slightly delayed, so we check the approximate hour/minute
            CURRENT_MINUTE=$(date -u +"%M")
            if [ "$CURRENT_MINUTE" -ge "40" ] && [ "$CURRENT_MINUTE" -le "59" ]; then
              echo "mode=prefetch" >> $GITHUB_ENV
            else
              echo "mode=dispatch" >> $GITHUB_ENV
            fi
          fi

      - name: Trigger Next.js Cron Proxy
        run: |
          echo "Executing mode: ${{ env.mode }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/cron/camping-reminder?mode=${{ env.mode }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to invoke Cron Proxy with status $HTTP_STATUS"
            exit 1
          fi
