name: RAONAI Daily Restaurant & Mart Crawl Enrichment

on:
  schedule:
    # 매일 05:17 KST 실행 (UTC 20:17)
    - cron: '17 20 * * *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  enrich-crawl-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Install Playwright Browsers and Deps
        run: npx playwright install chromium --with-deps

      - name: Run Playwright Enrichment Crawler
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/daily-enrich-playwright.mjs

      - name: Commit and Push Cursor File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/last_enrich_cursor_id.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chrono: update daily enrichment cursor ID" && git push)

      - name: Log Result
        run: echo "Crawl enrichment completed successfully at $(date)"
