name: RAONAI Daily Region Sync (17-Day Rotation)

on:
  # [v15.0 2중 안전망] 1차 외부 크론잡(04:00 KST) + 2차 깃허브 백업 스케줄러(06:07 KST)
  schedule:
    # 06:07 KST 실행 (UTC 21:07) - 1차 완료 시 0초 스킵, 미완료 시 백업 재실행
    - cron: '7 21 * * *'
  workflow_dispatch: # 수동 및 외부 트리거 허용

jobs:
  sync-region-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Daily Region Sync Engine
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          SAFE_RESTAURANT_API_KEY: ${{ secrets.SAFE_RESTAURANT_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node scripts/daily-region-sync.mjs

      - name: Log Result
        run: echo "Daily Regional Sync completed at $(date)"
